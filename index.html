<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>신나는 영어구구단</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Andika:wght@400;700&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
  <script>
    // 같은 앱의 비비드 색 버전: 주소가 /vivid/ 로 시작하면 (vercel.json이 같은 파일을 보여 줌)
    if (/^\/vivid(\/|$)/.test(location.pathname)) document.documentElement.dataset.theme = "vivid";
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <noscript>이 앱은 JavaScript가 켜져 있어야 동작합니다.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
